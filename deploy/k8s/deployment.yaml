apiVersion: apps/v1
kind: Deployment
metadata:
  name: vepforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vepforge
  template:
    metadata:
      labels:
        app: vepforge
    spec:
      containers:
        - name: vepforge
          image: vepforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LLM_PROVIDER
              value: "mock"
