name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Compile check
        run: python -m compileall vepforge
      - name: Doctor smoke
        run: python -m vepforge.cli.main doctor
      - name: Tests
        run: python -m pytest -q
